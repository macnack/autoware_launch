# Nav2 MPPI controller for the off-road local layer (BACKLOG #11).
# Loaded only when local_layer:=mppi. MPPI (Model Predictive Path Integral) samples
# control sequences forward through a dynamics model — feasible by construction,
# reverses by default (vx_min < 0), and is what DARPA RACER / NASA JPL / Georgia Tech
# AutoRally use for rough-terrain kinodynamic driving.
#
# CAVEATS (research/lattice-motion-planning.md):
#   * GPU strongly recommended — parallel rollouts (batch_size x time_steps) are the cost.
#     On CPU-only hosts lower controller_frequency / batch_size.
#   * MPPI is local-minima-prone; tune ObstaclesCritic repulsion + PathAlign weight.
#   * Critic weights below are Nav2 defaults adapted to Ackermann/off-road and are UNTUNED.
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    controller_plugins: ["FollowPath"]
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.5      # forward-only: position goal; a small overshoot still counts
      yaw_goal_tolerance: 0.1745  # +-10 deg; with reverse (allow_reverse) the vehicle can align a pose
      stateful: true
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      vx_max: 2.5          # max forward speed [m/s]; >~3 makes forward-only arcs too wide to hit goals
      vx_min: 0.0          # v1 forward-only: reverse needs gear sequencing in the bridge (follow-up)
      vy_max: 0.0          # Ackermann: no lateral velocity
      wz_max: 1.0
      ax_max: 3.0
      ax_min: -3.0
      az_max: 3.5
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "Ackermann"
      visualize: false
      AckermannConstraints:
        min_turning_r: 3.5   # matches planner minimum_turning_radius
      critics: ["ConstraintCritic", "GoalCritic", "GoalAngleCritic", "PreferForwardCritic", "ObstaclesCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        # attract to the exact goal point from farther out: with 1.4 nothing pulled
        # toward the goal until inside 1.4 m — the vehicle tracked the (staler) path,
        # passed ~3.5 m abeam of the goal and looped to retry.
        threshold_to_consider: 4.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      # Reactive obstacle avoidance — vanilla MPPI does not model obstacles (BACKLOG #11).
      # Swap for CostCritic when the traversability costmap (BACKLOG #4) lands.
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        consider_footprint: false
        collision_cost: 10000.0
        collision_margin_distance: 0.10
        near_goal_distance: 0.5
        inflation_radius: 2.0
        cost_scaling_factor: 3.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

# local_costmap is loaded separately — see nav2_offroad_local_costmap.param.yaml,
# shared with the RPP controller config so the two can't drift out of sync.
