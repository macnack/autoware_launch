# Planner motion-model overlay for allow_reverse:=true (mppi_recovery only).
# REEDS_SHEPP plans forward AND reverse arcs, so poses behind the vehicle
# become reachable. reverse_penalty stays as set in nav2_offroad.param.yaml.
planner_server:
  ros__parameters:
    GridBased:
      motion_model_for_search: "REEDS_SHEPP"
      # Direction changes are NOT free: with change_penalty 0 the planner emits
      # park-style shuffle paths (2 cusps in a 17-pose plan observed live) and the
      # vehicle thrashed gears (7 shifts in 20 s) — each cusp costs a full
      # stop-and-shift. Penalize cusps so it only reverses when genuinely needed.
      change_penalty: 0.3
