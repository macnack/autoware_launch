# MPPI velocity-range overlay for allow_reverse:=true: allow reverse sampling.
# Reverse capped slower than forward (vx_max 2.5) — cautious by default.
#
# REEDS_SHEPP paths contain reverse segments. Two stock-critic settings made MPPI
# drive them the WRONG WAY (steer away from the goal, circle forever):
#   * PreferForwardCritic penalized the reverse motion the path demanded;
#   * PathAlignCritic ignored path orientations, tracking reverse segments
#     positionally — i.e. driving them forwards.
controller_server:
  ros__parameters:
    FollowPath:
      vx_min: -1.5
      PreferForwardCritic:
        enabled: false
      PathAlignCritic:
        use_path_orientations: true
