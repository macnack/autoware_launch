# SmacPlannerLattice — optional A/B global planner for off-road (BACKLOG #11).
# Loaded as an OVERLAY on nav2_offroad.param.yaml (which still supplies global_costmap
# and smoother_server) when global_planner:=lattice. State-lattice search over a
# precomputed Ackermann control set: feasible by construction, D*-replan friendly.
#
# TRADE-OFF (research/lattice-motion-planning.md): turning radius and grid resolution
# are FROZEN in the control set at generation time (no runtime tuning, no downsampler),
# unlike SmacPlannerHybrid. This is why it is an A/B test, not the default.
planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerLattice"
      allow_unknown: true
      tolerance: 0.25
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.05
      cost_penalty: 2.0
      rotation_penalty: 5.0
      retrospective_penalty: 0.015
      allow_reverse_expansion: false
      # Empty -> Nav2 falls back to its bundled default Ackermann control set.
      # For a real vehicle, generate a control set matching the turning radius
      # (frozen at generation time — see trade-off note above).
      lattice_filepath: ""
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
