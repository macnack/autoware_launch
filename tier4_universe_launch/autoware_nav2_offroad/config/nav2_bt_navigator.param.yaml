# bt_navigator for the MPPI off-road local layer (BACKLOG #11). Required so the
# planned global path is handed to controller_server (FollowPath) — the NavigateToPose
# behavior tree runs ComputePathToPose then FollowPath. Loaded only when local_layer:=mppi.
#
# NOTE: the navigator plugin names below are the Nav2 Humble/Jazzy form.
# A recovery-FREE custom BT is used (config/behavior_trees/navigate_to_pose_no_recovery.xml,
# wired via default_nav_to_pose_bt_xml in nav2_offroad.launch.xml). The stock default BTs
# call spin/backup/wait recovery actions from behavior_server (nav2_behaviors), which this
# launch does not run and which are inappropriate for a forward-only off-road vehicle —
# so bt_navigator could never activate with the stock BTs. Only the navigate_to_pose
# navigator is loaded (the through_poses stock BT also requires the recovery servers).
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /localization/kinematic_state
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code
