# bt_navigator for the MPPI off-road local layer (BACKLOG #11). Required so the
# planned global path is handed to controller_server (FollowPath) — the NavigateToPose
# behavior tree runs ComputePathToPose then FollowPath. Loaded only when local_layer:=mppi.
#
# NOTE: the navigator plugin names below are the Nav2 Humble/Jazzy form. The stock
# default behavior-tree XMLs shipped by nav2_bt_navigator are used (no custom BT).
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /localization/kinematic_state
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code
